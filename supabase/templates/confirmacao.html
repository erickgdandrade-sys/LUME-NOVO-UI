<div
  style="
    margin: 0;
    padding: 32px 16px;
    background: #f4f7fb;
    font-family: Arial, Helvetica, sans-serif;
    color: #1b2744;
  "
>
  <div
    style="
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      border: 1px solid #e3e8f0;
    "
  >
    <img
      src="{{ .SiteURL }}/email-logo.png"
      alt="Lume"
      height="44"
      style="display: block; height: 44px; margin: 0 0 24px"
    />
    <h1 style="margin: 0 0 12px; font-size: 22px">Confirme seu e-mail</h1>
    <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6">
      Olá{{ if .Data.nome }}, {{ .Data.nome }}{{ end }}! Que bom ter você na Lume. Para ativar sua
      conta, confirme que este e-mail é seu:
    </p>
    <p style="margin: 24px 0">
      <a
        href="{{ .SiteURL }}/confirmar?token_hash={{ .TokenHash }}&type=email"
        style="
          display: inline-block;
          background: #3f74e0;
          color: #ffffff;
          text-decoration: none;
          font-weight: bold;
          font-size: 15px;
          padding: 14px 28px;
          border-radius: 999px;
        "
        >Confirmar meu e-mail</a
      >
    </p>
    <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #6b7690">
      Se você não criou uma conta na Lume, é só ignorar este e-mail.
    </p>
  </div>
  <p
    style="
      max-width: 520px;
      margin: 16px auto 0;
      text-align: center;
      font-size: 12px;
      color: #8a94ab;
    "
  >
    Lume · Mais inclusão, menos barreiras
  </p>
</div>
